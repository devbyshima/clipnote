<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34343A"/>
      <stop offset="1" stop-color="#151518"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEAE6"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7A50"/>
      <stop offset="1" stop-color="#EE3F22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#iconShadow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="3"/>
  <!-- film perforations -->
  <g fill="#FFFFFF" fill-opacity="0.13">
    <rect x="152" y="210" width="34" height="46" rx="9"/>
    <rect x="152" y="300" width="34" height="46" rx="9"/>
    <rect x="152" y="390" width="34" height="46" rx="9"/>
    <rect x="152" y="480" width="34" height="46" rx="9"/>
    <rect x="152" y="570" width="34" height="46" rx="9"/>
    <rect x="152" y="660" width="34" height="46" rx="9"/>
    <rect x="152" y="750" width="34" height="46" rx="9"/>
    <rect x="838" y="210" width="34" height="46" rx="9"/>
    <rect x="838" y="300" width="34" height="46" rx="9"/>
    <rect x="838" y="390" width="34" height="46" rx="9"/>
    <rect x="838" y="480" width="34" height="46" rx="9"/>
    <rect x="838" y="570" width="34" height="46" rx="9"/>
    <rect x="838" y="660" width="34" height="46" rx="9"/>
    <rect x="838" y="750" width="34" height="46" rx="9"/>
  </g>
  <!-- note page -->
  <g filter="url(#shadow)" transform="rotate(-4 512 512)">
    <rect x="262" y="214" width="470" height="590" rx="40" fill="url(#paper)"/>
  </g>
  <g transform="rotate(-4 512 512)">
    <rect x="322" y="292" width="250" height="34" rx="17" fill="#1C1C1F"/>
    <rect x="322" y="372" width="350" height="20" rx="10" fill="#B9B6B0"/>
    <rect x="322" y="418" width="330" height="20" rx="10" fill="#B9B6B0"/>
    <rect x="322" y="464" width="350" height="20" rx="10" fill="#B9B6B0"/>
    <rect x="322" y="510" width="210" height="20" rx="10" fill="#B9B6B0"/>
    <rect x="322" y="580" width="340" height="20" rx="10" fill="#B9B6B0"/>
    <rect x="322" y="626" width="250" height="20" rx="10" fill="#B9B6B0"/>
  </g>
  <!-- play badge -->
  <g filter="url(#shadow)">
    <circle cx="676" cy="688" r="132" fill="url(#badge)"/>
  </g>
  <circle cx="676" cy="688" r="130" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="4"/>
  <path d="M640 622 L742 688 L640 754 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round"/>
</svg>
