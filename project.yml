name: Ovyl
options:
  bundleIdPrefix: com.fulltimestudio
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7WHQR6L96K
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  Ovyl:
    build:
      targets:
        Ovyl: all
        OvylTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OvylTests
    profile:
      config: Release
    archive:
      config: Release

targets:
  Ovyl:
    type: application
    platform: macOS
    sources:
      - path: Ovyl
      # The Whisper model and tokenizer ship inside the app, so transcription
      # never needs a download. Fetched by scripts/fetch-models.sh.
      - path: Models/Whisper
        type: folder
        buildPhase: resources
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    entitlements:
      path: Ovyl/App/Ovyl.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fulltimestudio.ovyl
        PRODUCT_NAME: Ovyl
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Ovyl/App/Info.plist
      properties:
        CFBundleDisplayName: Ovyl
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Everything stays on this Mac.
        NSSpeechRecognitionUsageDescription: Ovyl transcribes the speech in your videos on this Mac. Nothing leaves your computer.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.fulltimestudio.ovyl.note
            UTTypeDescription: Ovyl Note
            UTTypeConformsTo: [public.data]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.audiovisual-content]
          - CFBundleTypeName: Picture
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.image]

  OvylTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OvylTests
        excludes: [Fixtures]
      - path: OvylTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Ovyl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fulltimestudio.ovyl.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Ovyl.app/Contents/MacOS/Ovyl
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
