name: Clipnote
options:
  bundleIdPrefix: com.fulltimestudio
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  ArgmaxOSS:
    url: https://github.com/argmaxinc/argmax-oss-swift
    from: 1.1.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7WHQR6L96K
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  Clipnote:
    build:
      targets:
        Clipnote: all
        ClipnoteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClipnoteTests
    profile:
      config: Release
    archive:
      config: Release

targets:
  Clipnote:
    type: application
    platform: macOS
    sources:
      - path: Clipnote
      # The Whisper model and tokenizer ship inside the app, so transcription
      # never needs a download. Fetched by scripts/fetch-models.sh.
      - path: Models/Whisper
        type: folder
        buildPhase: resources
    dependencies:
      - package: ArgmaxOSS
        product: WhisperKit
    entitlements:
      path: Clipnote/App/Clipnote.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fulltimestudio.clipnote
        PRODUCT_NAME: Clipnote
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Clipnote/App/Info.plist
      properties:
        CFBundleDisplayName: Clipnote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Everything stays on this Mac.
        NSSpeechRecognitionUsageDescription: Clipnote transcribes the speech in your videos on this Mac. Nothing leaves your computer.
        CFBundleDocumentTypes:
          - CFBundleTypeName: Video
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.movie, public.audiovisual-content]

  ClipnoteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClipnoteTests
        excludes: [Fixtures]
      - path: ClipnoteTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Clipnote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fulltimestudio.clipnote.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Clipnote.app/Contents/MacOS/Clipnote
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES
